<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background: #f0f2f5; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; margin-bottom: 20px; }
        input { width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Register</h2>
        <form id="regForm">
            <input type="text" id="rUser" placeholder="Username" required>
            <input type="password" id="rPass" placeholder="Password (min 8)" required>
            <button type="submit">Create Account</button>
        </form>
    </div>

    <div class="box">
        <h2>Login</h2>
        <form id="logForm">
            <input type="text" id="lUser" placeholder="Username" required>
            <input type="password" id="lPass" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="status"></div>

    <script src="script.js"></script>
    <script>src="basics.js"</script>
</body>
</html>
